services:
  - type: web
    name: ecommerce-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - {key: APP_ENV, value: production}
      - {key: DATABASE_URL, sync: false}
      - {key: JWT_SECRET, sync: false}
      - {key: ADMIN_EMAIL, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: WIDGET_API_KEY, sync: false}
      - {key: CORS_ORIGINS, sync: false}
      - {key: ENGINEERING_EMAIL, sync: false}
      - {key: SHOPIFY_STORE_DOMAIN, sync: false}
      - {key: SHOPIFY_ADMIN_TOKEN, sync: false}
      - {key: SHOPIFY_STOREFRONT_TOKEN, sync: false}
      - {key: SHOPIFY_WEBHOOK_SECRET, sync: false}
